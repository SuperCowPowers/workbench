<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
  <defs>
    <marker id="cf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8b95a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="450" y="34" text-anchor="middle" fill="#ccc" font-family="Helvetica, Arial" font-size="24" font-weight="bold">Conformal Calibration</text>
  <text x="450" y="58" text-anchor="middle" fill="#999" font-family="Helvetica, Arial" font-size="15">one multiplier from the calibration set, applied per compound</text>

  <text x="240" y="96" text-anchor="middle" fill="#6ea8ff" font-family="Helvetica, Arial" font-size="16" font-weight="bold">calibration set</text>
  <rect x="72" y="290" width="22" height="10" rx="2" fill="#3a86ff" opacity="0.75"/>
  <rect x="96" y="271" width="22" height="29" rx="2" fill="#3a86ff" opacity="0.75"/>
  <rect x="120" y="242" width="22" height="58" rx="2" fill="#3a86ff" opacity="0.75"/>
  <rect x="144" y="206" width="22" height="94" rx="2" fill="#3a86ff" opacity="0.75"/>
  <rect x="168" y="186" width="22" height="114" rx="2" fill="#3a86ff" opacity="0.75"/>
  <rect x="192" y="170" width="22" height="130" rx="2" fill="#3a86ff" opacity="0.75"/>
  <rect x="216" y="180" width="22" height="120" rx="2" fill="#3a86ff" opacity="0.75"/>
  <rect x="240" y="204" width="22" height="96" rx="2" fill="#3a86ff" opacity="0.75"/>
  <rect x="264" y="228" width="22" height="72" rx="2" fill="#3a86ff" opacity="0.75"/>
  <rect x="288" y="251" width="22" height="49" rx="2" fill="#3a86ff" opacity="0.75"/>
  <rect x="312" y="266" width="22" height="34" rx="2" fill="#ff9f43" opacity="0.75"/>
  <rect x="336" y="278" width="22" height="22" rx="2" fill="#ff9f43" opacity="0.75"/>
  <rect x="360" y="286" width="22" height="14" rx="2" fill="#ff9f43" opacity="0.75"/>
  <rect x="384" y="292" width="22" height="8" rx="2" fill="#ff9f43" opacity="0.75"/>
  <line x1="66" y1="300" x2="414" y2="300" stroke="#8b95a3" stroke-width="1.5"/>
  <line x1="310" y1="140" x2="310" y2="308" stroke="#ff9f43" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="320" y="134" fill="#ff9f43" font-family="Helvetica, Arial" font-size="14" font-weight="bold">q(90%) = 1.8</text>
  <text x="368" y="250" text-anchor="middle" fill="#ff9f43" font-family="Helvetica, Arial" font-size="13">10% tail</text>
  <text x="240" y="326" text-anchor="middle" fill="#9aa5b1" font-family="Helvetica, Arial" font-size="13">nonconformity = actual error / expected_residual</text>

  <line x1="440" y1="200" x2="478" y2="200" stroke="#8b95a3" stroke-width="1.8" marker-end="url(#cf)"/>

  <text x="675" y="96" text-anchor="middle" fill="#00d4aa" font-family="Helvetica, Arial" font-size="16" font-weight="bold">any new compound</text>
  <text x="675" y="148" text-anchor="middle" fill="#ccc" font-family="Helvetica, Arial" font-size="13">expected_residual = 0.15</text>
  <line x1="635" y1="170" x2="715" y2="170" stroke="#00d4aa" stroke-width="3"/>
  <line x1="635" y1="161" x2="635" y2="179" stroke="#00d4aa" stroke-width="3"/>
  <line x1="715" y1="161" x2="715" y2="179" stroke="#00d4aa" stroke-width="3"/>
  <circle cx="675" cy="170" r="5" fill="#ccc"/>
  <text x="675" y="198" text-anchor="middle" fill="#9aa5b1" font-family="Helvetica, Arial" font-size="13">interval = ±0.27</text>
  <text x="675" y="230" text-anchor="middle" fill="#ccc" font-family="Helvetica, Arial" font-size="13">expected_residual = 0.62</text>
  <line x1="510" y1="252" x2="840" y2="252" stroke="#00d4aa" stroke-width="3"/>
  <line x1="510" y1="243" x2="510" y2="261" stroke="#00d4aa" stroke-width="3"/>
  <line x1="840" y1="243" x2="840" y2="261" stroke="#00d4aa" stroke-width="3"/>
  <circle cx="675" cy="252" r="5" fill="#ccc"/>
  <text x="675" y="280" text-anchor="middle" fill="#9aa5b1" font-family="Helvetica, Arial" font-size="13">interval = ±1.12</text>
  <text x="675" y="326" text-anchor="middle" fill="#9aa5b1" font-family="Helvetica, Arial" font-size="13">same multiplier, width scales with expected_residual</text>
</svg>
