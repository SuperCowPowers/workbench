<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610">
  <defs>
    <linearGradient id="dataBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5f6b7a"/>
      <stop offset="100%" stop-color="#454f5c"/>
    </linearGradient>
    <linearGradient id="modelBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a86ff"/>
      <stop offset="100%" stop-color="#2a66cc"/>
    </linearGradient>
    <linearGradient id="adBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9f43"/>
      <stop offset="100%" stop-color="#cc7a30"/>
    </linearGradient>
    <linearGradient id="uqBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9b59b6"/>
      <stop offset="100%" stop-color="#7d3f96"/>
    </linearGradient>
    <linearGradient id="outBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#00a080"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8b95a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="450" y="34" text-anchor="middle" fill="#ccc" font-family="Helvetica, Arial" font-size="24" font-weight="bold">Deployed Endpoint with UQ</text>
  <text x="450" y="58" text-anchor="middle" fill="#999" font-family="Helvetica, Arial" font-size="15">applicability domain and ensemble, together</text>

  <rect x="340" y="82" width="220" height="54" rx="8" fill="url(#dataBox)"/>
  <text x="450" y="106" text-anchor="middle" fill="white" font-family="Helvetica, Arial" font-size="17" font-weight="bold">SMILES batch</text>
  <text x="450" y="126" text-anchor="middle" fill="#dde3ea" font-family="Helvetica, Arial" font-size="13">one row per compound</text>

  <line x1="450" y1="136" x2="450" y2="152" stroke="#8b95a3" stroke-width="1.8"/>
  <line x1="250" y1="152" x2="650" y2="152" stroke="#8b95a3" stroke-width="1.8"/>
  <line x1="250" y1="152" x2="250" y2="170" stroke="#8b95a3" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="650" y1="152" x2="650" y2="170" stroke="#8b95a3" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="90" y="176" width="320" height="90" rx="8" fill="url(#modelBox)"/>
  <text x="250" y="202" text-anchor="middle" fill="white" font-family="Helvetica, Arial" font-size="16" font-weight="bold">ChemProp 5-fold ensemble</text>
  <rect x="98" y="216" width="56" height="32" rx="5" fill="#ffffff" opacity="0.18"/>
  <text x="126" y="237" text-anchor="middle" fill="white" font-family="Helvetica, Arial" font-size="13">fold 1</text>
  <rect x="160" y="216" width="56" height="32" rx="5" fill="#ffffff" opacity="0.18"/>
  <text x="188" y="237" text-anchor="middle" fill="white" font-family="Helvetica, Arial" font-size="13">fold 2</text>
  <rect x="222" y="216" width="56" height="32" rx="5" fill="#ffffff" opacity="0.18"/>
  <text x="250" y="237" text-anchor="middle" fill="white" font-family="Helvetica, Arial" font-size="13">fold 3</text>
  <rect x="284" y="216" width="56" height="32" rx="5" fill="#ffffff" opacity="0.18"/>
  <text x="312" y="237" text-anchor="middle" fill="white" font-family="Helvetica, Arial" font-size="13">fold 4</text>
  <rect x="346" y="216" width="56" height="32" rx="5" fill="#ffffff" opacity="0.18"/>
  <text x="374" y="237" text-anchor="middle" fill="white" font-family="Helvetica, Arial" font-size="13">fold 5</text>

  <rect x="490" y="176" width="320" height="90" rx="8" fill="url(#adBox)"/>
  <text x="650" y="202" text-anchor="middle" fill="#3a2a12" font-family="Helvetica, Arial" font-size="16" font-weight="bold">Applicability Domain</text>
  <text x="650" y="226" text-anchor="middle" fill="#4a3618" font-family="Helvetica, Arial" font-size="13">k = 10 nearest training neighbors</text>
  <text x="650" y="248" text-anchor="middle" fill="#4a3618" font-family="Helvetica, Arial" font-size="13">by fingerprint similarity</text>

  <line x1="250" y1="266" x2="250" y2="288" stroke="#8b95a3" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="650" y1="266" x2="650" y2="288" stroke="#8b95a3" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="130" y="294" width="640" height="136" rx="8" fill="url(#uqBox)"/>
  <text x="450" y="324" text-anchor="middle" fill="white" font-family="Helvetica, Arial" font-size="20" font-weight="bold">RF UQ Model</text>

  <text x="270" y="363" text-anchor="end" fill="#e8dcf0" font-family="Helvetica, Arial" font-size="13" font-weight="bold">Ensemble</text>
  <rect x="286" y="344" width="170" height="28" rx="5" fill="#ffffff" opacity="0.18"/>
  <text x="371" y="363" text-anchor="middle" fill="white" font-family="Helvetica, Arial" font-size="13">prediction</text>
  <rect x="470" y="344" width="170" height="28" rx="5" fill="#ffffff" opacity="0.18"/>
  <text x="555" y="363" text-anchor="middle" fill="white" font-family="Helvetica, Arial" font-size="13">prediction_std</text>

  <text x="270" y="403" text-anchor="end" fill="#e8dcf0" font-family="Helvetica, Arial" font-size="13" font-weight="bold">KNN / AD</text>
  <rect x="286" y="384" width="140" height="28" rx="5" fill="#ffffff" opacity="0.18"/>
  <text x="356" y="403" text-anchor="middle" fill="white" font-family="Helvetica, Arial" font-size="13">distance</text>
  <rect x="438" y="384" width="140" height="28" rx="5" fill="#ffffff" opacity="0.18"/>
  <text x="508" y="403" text-anchor="middle" fill="white" font-family="Helvetica, Arial" font-size="13">target_std</text>
  <rect x="590" y="384" width="140" height="28" rx="5" fill="#ffffff" opacity="0.18"/>
  <text x="660" y="403" text-anchor="middle" fill="white" font-family="Helvetica, Arial" font-size="13">pred_gap</text>

  <line x1="450" y1="430" x2="450" y2="454" stroke="#8b95a3" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="140" y="460" width="620" height="130" rx="8" fill="url(#outBox)" opacity="0.16" stroke="#00d4aa" stroke-width="1.5"/>
  <text x="450" y="486" text-anchor="middle" fill="#00d4aa" font-family="Helvetica, Arial" font-size="17" font-weight="bold">13 columns added to every row</text>

  <rect x="160" y="500" width="180" height="76" rx="6" fill="#00d4aa" opacity="0.12"/>
  <text x="250" y="524" text-anchor="middle" fill="#ccc" font-family="Helvetica, Arial" font-size="15" font-weight="bold">confidence</text>
  <text x="250" y="546" text-anchor="middle" fill="#9aa5b1" font-family="Helvetica, Arial" font-size="13">0 = don't trust it</text>
  <text x="250" y="566" text-anchor="middle" fill="#9aa5b1" font-family="Helvetica, Arial" font-size="13">1 = trust it</text>

  <rect x="360" y="500" width="180" height="76" rx="6" fill="#00d4aa" opacity="0.12"/>
  <text x="450" y="524" text-anchor="middle" fill="#ccc" font-family="Helvetica, Arial" font-size="15" font-weight="bold">expected_residual</text>
  <text x="450" y="546" text-anchor="middle" fill="#9aa5b1" font-family="Helvetica, Arial" font-size="13">predicted error size</text>
  <text x="450" y="566" text-anchor="middle" fill="#9aa5b1" font-family="Helvetica, Arial" font-size="13">in target units</text>

  <rect x="560" y="500" width="180" height="76" rx="6" fill="#00d4aa" opacity="0.12"/>
  <text x="650" y="524" text-anchor="middle" fill="#ccc" font-family="Helvetica, Arial" font-size="15" font-weight="bold">q_025 … q_975</text>
  <text x="650" y="546" text-anchor="middle" fill="#9aa5b1" font-family="Helvetica, Arial" font-size="13">11 interval bounds</text>
  <text x="650" y="566" text-anchor="middle" fill="#9aa5b1" font-family="Helvetica, Arial" font-size="13">q_50 = prediction</text>
</svg>
