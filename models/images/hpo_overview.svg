<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 340" role="img">
<title>HPO wrapped over model creation</title>
<desc>Hyperparameter optimization as a wrapper enclosing normal model creation: the search
driver hands hyperparameters down into the Models (one template per framework, shown
stacked), results come back up, and this repeats for n_trials inside a single training
job. Only the winning config leaves the wrapper to become the AWS published model,
shown as a miniature prediction-versus-actual scatter with a confidence colorbar.</desc>
<defs>
<marker id="hpoArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.hpo-t { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 500; fill: #0F6E56; }
.hpo-s { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; fill: #0F6E56; }
.hpo-pt { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 500; fill: #3C3489; }
.hpo-ps { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; fill: #534AB7; }
.hpo-nt { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.hpo-ns { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; fill: #5F5E5A; }
.hpo-wrap { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
.hpo-tmpl { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
.hpo-card { fill: #FFFFFF; stroke: #888780; stroke-width: 0.5; }
.hpo-edge { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
@media (prefers-color-scheme: dark) {
  .hpo-t, .hpo-s { fill: #9FE1CB; }
  .hpo-pt { fill: #CECBF6; } .hpo-ps { fill: #AFA9EC; }
  .hpo-nt { fill: #F1EFE8; } .hpo-ns { fill: #B4B2A9; }
  .hpo-wrap { fill: #085041; stroke: #9FE1CB; }
  .hpo-tmpl { fill: #3C3489; stroke: #AFA9EC; }
  .hpo-card { fill: #2C2C2A; stroke: #B4B2A9; }
  .hpo-edge { stroke: #B4B2A9; }
}
</style>
</defs>

<rect class="hpo-wrap" x="30" y="40" width="560" height="270" rx="8"/>
<text class="hpo-t" x="310" y="72" text-anchor="middle">HPO — the search driver</text>
<text class="hpo-s" x="310" y="90" text-anchor="middle">picks hyperparameters · judges scores</text>
<text class="hpo-s" x="310" y="288" text-anchor="middle">repeat × n_trials — trials stay inside</text>

<rect class="hpo-tmpl" x="207" y="182" width="220" height="66" rx="4"/>
<rect class="hpo-tmpl" x="201" y="176" width="220" height="66" rx="4"/>
<rect class="hpo-tmpl" x="195" y="170" width="220" height="66" rx="4"/>
<text class="hpo-pt" x="305" y="198" text-anchor="middle">Models</text>
<text class="hpo-ps" x="305" y="216" text-anchor="middle">chemprop · xgb · pytorch</text>

<line class="hpo-edge" x1="250" y1="108" x2="250" y2="164" marker-end="url(#hpoArrow)"/>
<text class="hpo-ns" x="242" y="132" text-anchor="end">here's your</text>
<text class="hpo-ns" x="242" y="148" text-anchor="end">hyperparameters</text>
<line class="hpo-edge" x1="366" y1="164" x2="366" y2="108" marker-end="url(#hpoArrow)"/>
<text class="hpo-ns" x="376" y="132">run,</text>
<text class="hpo-ns" x="376" y="148">return results</text>

<line class="hpo-edge" x1="594" y1="175" x2="650" y2="175" marker-end="url(#hpoArrow)"/>
<text class="hpo-ns" x="622" y="158" text-anchor="middle">only the</text>
<text class="hpo-ns" x="622" y="200" text-anchor="middle">winner leaves</text>

<rect class="hpo-card" x="655" y="92" width="275" height="196" rx="8"/>
<text class="hpo-nt" x="792" y="116" text-anchor="middle">AWS Published Model</text>
<text class="hpo-ns" x="792" y="134" text-anchor="middle">the winner — or your defaults</text>
