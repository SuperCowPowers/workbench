<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 340" role="img">
<title>HPO wrapped over model creation</title>
<desc>Hyperparameter optimization as a wrapper enclosing normal model creation: the search
driver hands hyperparameters down into the Models (one template per framework, shown
stacked), results come back up, and this repeats for n_trials inside a single training
job. Only the winning config is published as the AWS model, shown as a miniature
prediction-versus-actual scatter with a confidence colorbar.</desc>
<defs>
<marker id="hpoArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.hpo-t { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 18px; font-weight: 600; fill: #0F6E56; }
.hpo-s { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; font-weight: 400; fill: #0F6E56; }
.hpo-pt { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; fill: #3C3489; }
.hpo-ps { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 400; fill: #534AB7; }
.hpo-nt { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 18px; font-weight: 600; fill: #2C2C2A; }
.hpo-ns { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 400; fill: #5F5E5A; }
.hpo-wrap { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
.hpo-tmpl { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
.hpo-card { fill: #FFFFFF; stroke: #888780; stroke-width: 0.5; }
.hpo-edge { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
@media (prefers-color-scheme: dark) {
  .hpo-t, .hpo-s { fill: #9FE1CB; }
  .hpo-pt { fill: #CECBF6; } .hpo-ps { fill: #AFA9EC; }
  .hpo-nt { fill: #F1EFE8; } .hpo-ns { fill: #B4B2A9; }
  .hpo-wrap { fill: #085041; stroke: #9FE1CB; }
  .hpo-tmpl { fill: #3C3489; stroke: #AFA9EC; }
  .hpo-card { fill: #2C2C2A; stroke: #B4B2A9; }
  .hpo-edge { stroke: #B4B2A9; }
}
</style>
</defs>

<rect class="hpo-wrap" x="30" y="40" width="470" height="270" rx="8"/>
<text class="hpo-t" x="265" y="74" text-anchor="middle">HPO — the search driver</text>
<text class="hpo-s" x="265" y="96" text-anchor="middle">picks hyperparameters · judges scores</text>
<text class="hpo-s" x="265" y="292" text-anchor="middle">repeat × n_trials — trials stay inside</text>

<rect class="hpo-tmpl" x="147" y="190" width="260" height="72" rx="4"/>
<rect class="hpo-tmpl" x="141" y="184" width="260" height="72" rx="4"/>
<rect class="hpo-tmpl" x="135" y="178" width="260" height="72" rx="4"/>
<text class="hpo-pt" x="265" y="207" text-anchor="middle">Models</text>
<text class="hpo-ps" x="265" y="230" text-anchor="middle">chemprop · xgb · pytorch</text>

<line class="hpo-edge" x1="195" y1="115" x2="195" y2="172" marker-end="url(#hpoArrow)"/>
<text class="hpo-ns" x="187" y="136" text-anchor="end">here's your</text>
<text class="hpo-ns" x="187" y="154" text-anchor="end">hyperparameters</text>
<line class="hpo-edge" x1="345" y1="172" x2="345" y2="115" marker-end="url(#hpoArrow)"/>
<text class="hpo-ns" x="355" y="136">run,</text>
<text class="hpo-ns" x="355" y="154">return results</text>

<line class="hpo-edge" x1="506" y1="185" x2="584" y2="185" marker-end="url(#hpoArrow)"/>
<text class="hpo-ns" x="545" y="168" text-anchor="middle">winning gets</text>
<text class="hpo-ns" x="545" y="208" text-anchor="middle">published</text>

<rect class="hpo-card" x="590" y="92" width="330" height="200" rx="8"/>
<text class="hpo-nt" x="755" y="120" text-anchor="middle">AWS Published Model</text>
<text class="hpo-ns" x="755" y="142" text-anchor="middle">HPO Model with best performance</text>
